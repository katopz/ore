[package]
name = "ore-ingest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://ore.supply"
description = "ORE round winner data ingestion to Turso"
repository = "https://github.com/katopz/ore"
keywords = ["ore", "solana", "turso", "ingestion"]

[features]
# Phase 1: Simplified features
default = ["api"]
api = ["dep:axum"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0"
# Phase 1: Minimal dependencies only
axum = { version = "0.8.4", optional = true }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37.0", features = ["full"] }
backtrace = "0.3"
# Phase 2: Re-enabled database dependencies
turso = "0.2.2"
uuid = { version = "1.0", features = ["v4"] }

# Phase 3: Re-enabled Solana dependencies
solana-account-decoder = "^2.1"
solana-client = "^2.1"
solana-sdk = "^2.1"

# Phase 1: Commented out dependencies
# entropy-api = "0.1.4"
# entropy-types = "0.0.1"
# itertools = "0.12.0"
ore-api = { path = "../api" }
# steel = { features = ["spl"], version = "4.0.3" }

# Phase 2: Re-enabled database dependencies
# turso = "0.2.2"  # Already defined above
# uuid = { version = "1.0", features = ["v4"] }  # Already defined above

# Optional API dependencies
clap = { version = "4.0", features = ["derive"], optional = true }
# tower-http = { version = "0.6", features = ["cors"], optional = true }
