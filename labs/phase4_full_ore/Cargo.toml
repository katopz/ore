[package]
name = "phase4-full-ore"
version = "0.1.0"
edition = "2021"

# Exclude from workspace
[workspace]

[dependencies]
axum = "0.8.4"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Phase 2: Database dependencies
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Phase 3: Solana dependencies (aligned with workspace)
solana-account-decoder = "^2.1"
solana-client = "^2.1"
solana-sdk = "^2.1"

# Phase 4: ORE dependencies - using local path with standard dependencies
ore-api = { path = "../../api" }
bincode = "1.3.3"
itertools = "0.12"
spl-token = "^4"
spl-associated-token-account = "^6"
anyhow = "1.0"

[profile.release]
overflow-checks = true
