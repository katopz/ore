[package]
name = "phase3-axum-turso-solana"
version = "0.1.0"
edition = "2021"

# Exclude from workspace
[workspace]

[dependencies]
axum = "0.8.4"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Phase 2: Database dependencies
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
turso = "0.2.2"

# Phase 3: Solana dependencies
solana-account-decoder = "^2.1"
solana-client = "^2.1"
solana-sdk = "^2.1"

[profile.release]
overflow-checks = true
